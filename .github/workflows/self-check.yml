name: SPECTRALx Project Self-Check

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    name: Run Automated Self-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Self-Check Quality Script
        run: |
          chmod +x scripts/self-check.sh
          ./scripts/self-check.sh

      - name: Upload Self-Check Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-check-report
          path: SELF-CHECK-REPORT.md
